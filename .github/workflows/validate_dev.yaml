name: Validate against SF Labs org

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize]
    paths:
      - "force-app/**"
jobs:
  lwc-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Jest Tests with Coverage
        run: npm run test:unit -- --coverage --coverageReporters=text --coverageDirectory=coverage

      - name: Fail if coverage is below 100%
        run: |
          COVERAGE=$(node -pe "require('./coverage/coverage-summary.json').total.statements.pct")
          if (( $(echo "$COVERAGE < 100" | bc -l) )); then
            echo "❌ Coverage is below 100%! Current coverage: $COVERAGE%"
            exit 1
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov-report/
          retention-days: 5

  mutation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation

  salesforce-code-analyzer-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Salesforce Code Analyzer v4.x CLI Plugin
        run: sf plugins install @salesforce/sfdx-scanner@latest

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-command: run
          run-arguments: --normalize-severity --target . --outfile results.html
          results-artifact-name: salesforce-code-analyzer-results

      - name: Check the outputs to determine whether to fail
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-violations > 10
        run: exit 1

  apex-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        uses: salesforcecli/github-action@v1

      - name: Authenticate to org
        run: sfdx auth:sfdxurl:store --sfdx-url-file ./auth/devhub.sfdx --setdefaultusername --setalias devOrg

      - name: Run Apex Tests with Coverage
        run: |
          sfdx force:apex:test:run \
            --resultformat json \
            --outputdir test-results \
            --codecoverage \
            --testlevel RunLocalTests \
            --wait 10

      - name: Check Code Coverage
        run: |
          echo "Checking org-wide coverage..."
          coverageFile="test-results/test-result-codecoverage.json"
          if [ ! -f "$coverageFile" ]; then
            echo "❌ Coverage file not found!"
            exit 1
          fi

          # Compute org-wide average
          total=$(jq '[.coverage.coverage[].coverage] | add' "$coverageFile")
          count=$(jq '.coverage.coverage | length' "$coverageFile")
          avg=$(echo "$total / $count" | bc -l)
          echo "📊 Org-wide coverage: $avg%"

          # Fail if < 75
          if (( $(echo "$avg < 75" | bc -l) )); then
            echo "❌ Code coverage below 75%!"
            exit 1
          fi
        shell: bash

  validate-deployment:
    runs-on: ubuntu-latest
    needs: 
      - salesforce-code-analyzer-workflow
      - lwc-coverage
      - mutation-tests
      - apex-tests
    container:
      image: salesforce/cli:latest-slim
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Authenticate using SFLABS_DEV"
        run: |
          echo ${{ secrets.SFLABS_DEV }} | sf org login sfdx-url -s -u

      - name: "Validate"
        run: |
          sf project deploy validate -d force-app/ -l RunLocalTests -w 30