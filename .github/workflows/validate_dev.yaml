name: Validate against SF Labs org

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize]
    paths:
      - "force-app/**"
jobs:
  lwc-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Jest Tests with Coverage
        run: npm run test:unit -- --coverage --coverageReporters=text --coverageDirectory=coverage

      - name: Fail if coverage is below 100%
        run: |
          COVERAGE=$(node -pe "require('./coverage/coverage-summary.json').total.statements.pct")
          if (( $(echo "$COVERAGE < 100" | bc -l) )); then
            echo "❌ Coverage is below 100%! Current coverage: $COVERAGE%"
            exit 1
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov-report/
          retention-days: 5

  mutation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation

  salesforce-code-analyzer-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Salesforce Code Analyzer v4.x CLI Plugin
        run: sf plugins install @salesforce/sfdx-scanner@latest

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-command: run
          run-arguments: --normalize-severity --target . --outfile results.html
          results-artifact-name: salesforce-code-analyzer-results

      - name: Check the outputs to determine whether to fail
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-violations > 10
        run: exit 1

  apex-tests:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout source
          uses: actions/checkout@v3

        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '20'

        - name: Install Salesforce CLI
          run: npm install --global @salesforce/cli

        - name: "Authenticate using CW_DEMO"
          run: echo ${{ secrets.CW_DEMO }} | sf org login sfdx-url -s -u

        - name: Run Apex tests in package only
          run: |
            TEST_CLASSES=$(find force-app -name "*Test.cls" | sed 's/.*\///' | sed 's/.cls$//' | paste -sd "," -)
            echo "Running tests: $TEST_CLASSES"

            sf apex test run \
              --tests "$TEST_CLASSES" \
              --code-coverage \
              --result-format json \
              --output-dir ./test-results \
              --wait 10

        - name: Debug coverage file
          run: cat ./test-results/test-result-codecoverage.json

        - name: Upload Coverage File
          uses: actions/upload-artifact@v4
          with:
            name: apex-codecoverage
            path: ./test-results/test-result-codecoverage.json

        - name: Enforce Coverage Threshold
          run: |
            echo "Checking org-wide coverage..."
            file="./test-results/test-result-codecoverage.json"

            if [ ! -f "$file" ]; then
              echo "❌ Coverage results not found!"
              exit 1
            fi

            total=$(jq '[.[].coveredPercent] | add' $file)
            count=$(jq 'length' $file)
            avg=$(echo "$total / $count" | bc -l)

            echo "📊 Org-wide coverage: $avg%"

            # Set your desired minimum here (e.g., 75%)
            threshold=85
            if (( $(echo "$avg < $threshold" | bc -l) )); then
              echo "❌ Code coverage below ${threshold}%!"
              exit 1
            else
              echo "✅ Coverage check passed."
            fi
          shell: bash

  validate-deployment:
    runs-on: ubuntu-latest
    needs: 
      - salesforce-code-analyzer-workflow
      - lwc-coverage
      - mutation-tests
      - apex-tests
    container:
      image: salesforce/cli:latest-slim
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Authenticate using SFLABS_DEV"
        run: |
          echo ${{ secrets.SFLABS_DEV }} | sf org login sfdx-url -s -u

      - name: "Validate"
        run: |
          sf project deploy validate -d force-app/ -l RunLocalTests -w 30
