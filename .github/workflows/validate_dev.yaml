name: Validate against SF Labs org

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize]
    paths:
      - "force-app/**"
jobs:
  lwc-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Jest Tests with Coverage
        run: npm run test:unit -- --coverage --coverageReporters=text --coverageDirectory=coverage

      - name: Fail if coverage is below 100%
        run: |
          COVERAGE=$(node -pe "require('./coverage/coverage-summary.json').total.statements.pct")
          if (( $(echo "$COVERAGE < 100" | bc -l) )); then
            echo "❌ Coverage is below 100%! Current coverage: $COVERAGE%"
            exit 1
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov-report/
          retention-days: 5

  mutation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation

  apex-mutation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install jq and bc
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Download Apex Mutator
        run: |
          curl -L -o apex-mutator.jar https://github.com/jcbeaudoin/apex-mutator/releases/download/v0.5.2/apex-mutator-0.5.2.jar

      - name: Authenticate to Salesforce
        run: echo ${{ secrets.CW_DEMO }} | sf org login sfdx-url -s -u

      - name: Run Apex mutation tests
        run: |
          java -jar apex-mutator.jar \
            -s force-app/main/default/classes \
            -t force-app/main/default/classes \
            -u dev-org \
            -r reports/apex-mutation \
            --run-tests

      - name: Upload Apex mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-mutation-report
          path: reports/apex-mutation

      - name: Enforce Apex mutation threshold
        run: |
          score=$(jq '.mutationScore' reports/apex-mutation/result.json)
          echo "Mutation score: $score"
          threshold=70
          if (( $(echo "$score < $threshold" | bc -l) )); then
            echo "❌ Mutation score is below threshold ($threshold%)"
            exit 1
          else
            echo "✅ Mutation score meets threshold"
          fi

  salesforce-code-analyzer-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Salesforce Code Analyzer v4.x CLI Plugin
        run: sf plugins install @salesforce/sfdx-scanner@latest

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-command: run
          run-arguments: --normalize-severity --target . --outfile results.html
          results-artifact-name: salesforce-code-analyzer-results

      - name: Check the outputs to determine whether to fail
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-violations > 10
        run: exit 1

  validate-deployment:
    runs-on: ubuntu-latest
    needs: 
      - salesforce-code-analyzer-workflow
      - lwc-coverage
      - mutation-tests
      - apex-mutation-tests
    container:
      image: salesforce/cli:latest-slim
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Authenticate using SFLABS_DEV"
        run: |
          echo ${{ secrets.SFLABS_DEV }} | sf org login sfdx-url -s -u

      - name: "Validate"
        run: |
          sf project deploy validate -d force-app/ -l RunLocalTests -w 30